<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캐릿 뉴스 클리핑</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #111; }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .date-section { margin-bottom: 40px; }
    .date-label {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    .sort-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .sort-option {
      cursor: pointer;
      color: #aaa;
      padding: 4px 0;
    }
    .sort-option.active {
      color: #1d1d1f;
      font-weight: 600;
      border-bottom: 2px solid #1d1d1f;
    }
    .article-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border: 2px solid transparent;
    }
    .article-item:hover { background: #f9f9f9; }
    .article-item.selected { border-color: #007aff; background: #f0f6ff; }
    .article-item input[type="checkbox"] {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #007aff;
      flex-shrink: 0;
    }
    .article-content { flex: 1; }
    .article-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: #1d1d1f;
      text-decoration: none;
    }
    .article-title:hover { color: #007aff; }
    .article-meta {
      margin-top: 5px;
      font-size: 12px;
      color: #aaa;
      display: flex;
      gap: 10px;
    }
    .keyword-tag {
      background: #f0f0f5;
      color: #666;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .selected-count { font-size: 14px; color: #555; }
    .selected-count strong { color: #007aff; }
    .copy-btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #0066dd; }
    .copy-btn:disabled { background: #ccc; cursor: not-allowed; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 15px;
      line-height: 2;
    }
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d1d1f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .warning { font-size: 12px; color: #ff6b35; margin-top: 4px; }
    pb { padding-bottom: 80px; display: block; }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 15px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .update-btn {
      background: #34c759;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .update-btn:hover { background: #28a745; }
    .update-btn:disabled { background: #aaa; cursor: not-allowed; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .update-status { font-size: 11px; color: #888; }
  </style>
</head>
<body>

<header>
  <h1>📋 캐릿 뉴스 클리핑</h1>
  <div class="header-right">
    <button class="update-btn" id="update-btn" onclick="triggerUpdate()">🔄 지금 업데이트</button>
    <span class="update-status" id="update-status"></span>
  </div>
</header>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    뉴스를 불러오는 중...
  </div>
</div>

<pb></pb>

<div class="bottom-bar">
  <div>
    <div class="selected-count">선택된 기사: <strong id="count">0</strong>개</div>
    <div class="warning" id="warning" style="display:none">3개 이하로 선택해 주세요</div>
  </div>
  <button class="copy-btn" id="copy-btn" disabled onclick="copyPrompt()">
    Claude.ai 프롬프트 복사
  </button>
</div>

<div class="toast" id="toast">클립보드에 복사됐어요!</div>

<script>
  let articles = [];
  let selected = new Set();
  let sortMode = 'score'; // 기본: 관련도순

  function setSort(mode) {
    sortMode = mode;
    selected = new Set();
    render();
  }

  async function loadArticles() {
    try {
      const res = await fetch('data/articles.json?t=' + Date.now());
      articles = await res.json();
      render();
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">기사를 불러올 수 없어요.<br>업데이트 버튼을 눌러주세요.</div>';
    }
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const fmt = (dt) => `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
    if (fmt(d) === fmt(today)) return `오늘 · ${fmt(d)}`;
    if (fmt(d) === fmt(yesterday)) return `어제 · ${fmt(d)}`;
    return fmt(d);
  }

  function render() {
    if (!articles.length) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">수집된 기사가 없어요.<br>업데이트 버튼을 눌러주세요.</div>';
      return;
    }

    const dates = [...new Set(articles.map(a => a.date))].sort((a,b) => b.localeCompare(a));
    document.getElementById('update-status').textContent = `마지막 업데이트: ${dates[0] || ''}`;

    // 정렬
    let sorted = [...articles];
    if (sortMode === 'score') {
      // 관련도순: 점수 높은 순
      sorted.sort((a, b) => (b.score || 0) - (a.score || 0));
    } else {
      // 최신순: 날짜 먼저, 같은 날짜 안에서 점수순
      sorted.sort((a, b) => {
        if (b.date !== a.date) return b.date.localeCompare(a.date);
        return (b.score || 0) - (a.score || 0);
      });
    }

    const top50 = sorted.slice(0, 50);

    let html = `<div class="date-section">`;
    html += `<div class="sort-bar">
      <span class="sort-option ${sortMode === 'score' ? 'active' : ''}" onclick="setSort('score')">관련도순</span>
      <span class="sort-option ${sortMode === 'date' ? 'active' : ''}" onclick="setSort('date')">최신순</span>
    </div>`;
    html += `<div class="date-label">TOP ${top50.length}개</div>`;

    for (let i = 0; i < top50.length; i++) {
      const a = top50[i];
      const id = `top-${i}`;
      html += `
        <div class="article-item" id="item-${id}" onclick="toggleSelect('${id}', ${i})">
          <input type="checkbox" id="cb-${id}" onclick="event.stopPropagation(); toggleSelect('${id}', ${i})">
          <div class="article-content">
            <a class="article-title" href="${a.url}" target="_blank" onclick="event.stopPropagation()">${a.title}</a>
            <div class="article-meta">
              <span>${formatDate(a.date)}</span>
              <span>${a.source}</span>
              <span class="keyword-tag">${a.keyword}</span>
            </div>
          </div>
        </div>`;
    }
    html += `</div>`;
    document.getElementById('app').innerHTML = html;
  }

  function toggleSelect(id, idx) {
    const key = String(idx);
    const item = document.getElementById(`item-${id}`);
    const cb = document.getElementById(`cb-${id}`);
    if (selected.has(key)) {
      selected.delete(key);
      item.classList.remove('selected');
      cb.checked = false;
    } else {
      selected.add(key);
      item.classList.add('selected');
      cb.checked = true;
    }
    updateBar();
  }

  function updateBar() {
    const count = selected.size;
    document.getElementById('count').textContent = count;
    document.getElementById('copy-btn').disabled = count === 0;
    document.getElementById('warning').style.display = count > 3 ? 'block' : 'none';
  }

  function copyPrompt() {
    const items = [...selected].map(idx => {
      const sorted = [...articles];
      if (sortMode === 'score') {
        sorted.sort((a, b) => (b.score || 0) - (a.score || 0));
      } else {
        sorted.sort((a, b) => {
          if (b.date !== a.date) return b.date.localeCompare(a.date);
          return (b.score || 0) - (a.score || 0);
        });
      }
      return sorted[parseInt(idx)];
    }).filter(Boolean);
    if (!items.length) return;

    const articleList = items.map((a, i) =>
      `[기사 ${i+1}]\n제목: ${a.title}\nURL: ${a.url}\n${a.description ? '본문 요약: ' + a.description : ''}`
    ).join('\n\n');

    const prompt = `아래 뉴스 기사를 캐릿 스타일로 요약해줘.
캐릿은 Z세대 트렌드 미디어로, 소비·마케팅·트렌드 인사이트를 다루는 매체야.
각 기사를 3~4줄로 핵심만 요약해줘. 숫자와 구체적인 데이터 위주로 써줘.

${articleList}`;

    navigator.clipboard.writeText(prompt).then(() => {
      showToast();
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = prompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    });
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const REPO_OWNER = 'jeeyu0603-a11y';
  const REPO_NAME = 'news-clipper';
  const WORKFLOW_FILE = 'daily-crawl.yml';

  function getToken() {
    let token = localStorage.getItem('gh_token');
    if (!token) {
      token = prompt('GitHub Personal Access Token을 입력하세요:');
      if (token) localStorage.setItem('gh_token', token.trim());
    }
    return token;
  }

  async function triggerUpdate() {
    const token = getToken();
    if (!token) return;

    const btn = document.getElementById('update-btn');
    const status = document.getElementById('update-status');
    const prevFirstUrl = articles[0]?.url || null;

    btn.disabled = true;
    btn.textContent = '업데이트 중...';
    status.textContent = '수집 시작...';

    document.getElementById('app').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        뉴스를 수집하고 있어요...<br>
        <span style="font-size:13px;color:#aaa;margin-top:8px;display:block">약 3~5분 소요됩니다</span>
      </div>`;

    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
        {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        }
      );

      if (res.status === 401) {
        localStorage.removeItem('gh_token');
        alert('토큰이 유효하지 않아요. 다시 입력해주세요.');
        btn.disabled = false;
        btn.textContent = '🔄 지금 업데이트';
        loadArticles();
        return;
      }

      await pollWorkflow(token, prevFirstUrl);

    } catch (e) {
      status.textContent = '오류 발생. 다시 시도해주세요.';
      btn.disabled = false;
      btn.textContent = '🔄 지금 업데이트';
      loadArticles();
    }
  }

  async function pollWorkflow(token, prevFirstUrl) {
    const btn = document.getElementById('update-btn');
    const status = document.getElementById('update-status');
    let attempts = 0;
    let workflowDone = false;

    const interval = setInterval(async () => {
      attempts++;
      const totalSec = attempts * 10;
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      const elapsed = min > 0 ? `${min}분 ${sec}초` : `${sec}초`;

      try {
        if (!workflowDone) {
          const res = await fetch(
            `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1`,
            { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } }
          );
          const data = await res.json();
          const run = data.workflow_runs?.[0];

          if (run && run.status === 'completed') {
            workflowDone = true;
            status.textContent = `수집 완료, 페이지 반영 중... (${elapsed})`;
          } else {
            status.textContent = `뉴스 수집 중... (${elapsed})`;
          }
        }

        if (workflowDone) {
          const dataRes = await fetch('data/articles.json?t=' + Date.now());
          const newArticles = await dataRes.json();
          const newFirstUrl = newArticles[0]?.url || null;

          if (newFirstUrl !== prevFirstUrl && newArticles.length > 0) {
            clearInterval(interval);
            articles = newArticles;
            status.textContent = `마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;
            btn.disabled = false;
            btn.textContent = '🔄 지금 업데이트';
            render();
            return;
          }
          status.textContent = `페이지 반영 중... (${elapsed})`;
        }

        if (attempts > 30) {
          clearInterval(interval);
          status.textContent = '시간 초과. 새로고침 해주세요.';
          btn.disabled = false;
          btn.textContent = '🔄 지금 업데이트';
          loadArticles();
        }
      } catch (e) {
        clearInterval(interval);
        loadArticles();
      }
    }, 10000);
  }

  loadArticles();
</script>

</body>
</html>
