```html

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ebebeb;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      height: 72px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      height: 28px;
      width: auto;
      display: block;
    }

    .header-divider {
      width: 1px;
      height: 16px;
      background: #ddd;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 15px;
      color: #999;
      font-weight: 400;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .date-section { margin-bottom: 40px; }

    .date-label {
      font-size: 11px;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .sort-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .sort-option {
      cursor: pointer;
      color: #bbb;
      padding: 4px 0;
      letter-spacing: -0.2px;

      color: #1d1d1f;

      transition: all 0.15s;
      border: 1.5px solid transparent;

    .article-item.selected { border-color: #111; background: #fff; }

    .article-num {
      font-size: 12px;

      font-weight: 600;

      text-align: right;
    }

    .article-item.selected .article-num { color: #111; }
    .article-item input[type="checkbox"] { display: none; }
    .article-content { flex: 1; }

    .article-title {
      font-size: 15px;

    .article-item.selected .article-title { font-weight: 600; }

      background: #f4f4f4;
      color: #888;

      text-align: center;

    }

      width: 36px;
      height: 36px;

      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .update-btn {
      background: #111;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .update-btn:hover { background: #333; }
    .update-btn:disabled { background: #ccc; cursor: not-allowed; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; }
    .update-status { font-size: 11px; color: #bbb; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="logo.png.png" alt="Careet" class="header-logo">
    <div class="header-divider"></div>
    <span class="header-title">News clipping</span>
  </div>
  <div class="header-right">
    <button class="update-btn" id="update-btn" onclick="triggerUpdate()">업데이트</button>
    <span class="update-status" id="update-status"></span>
  </div>
</header>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    뉴스를 불러오는 중...
  </div>
</div>

<pb></pb>

<div class="bottom-bar">
  <div>
    <div class="selected-count">선택된 기사: <strong id="count">0</strong>개</div>
  </div>
  <button class="copy-btn" id="copy-btn" disabled onclick="adoptArticles()">
    채택
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  let articles = [];
  let selected = new Set();
  let sortMode = 'score';

  async function loadArticles() {
    try {
      const res = await fetch('data/articles.json?t=' + Date.now());
      articles = await res.json();
      render();
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">기사를 불러올 수 없어요.<br>크롤러가 아직 실행되지 않았거나 데이터가 없어요.</div>';
    }
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const fmt = (dt) => `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
    if (fmt(d) === fmt(today)) return `오늘 · ${fmt(d)}`;
    if (fmt(d) === fmt(yesterday)) return `어제 · ${fmt(d)}`;
    return fmt(d);
  }

  function cleanSource(source) {
    return (source || '').replace('www.', '');
  }

  function getAdoptedUrls() {
    try {
      return new Set(JSON.parse(localStorage.getItem('adopted_urls') || '[]'));
    } catch { return new Set(); }
  }

  function getSortedArticles() {
    const adopted = getAdoptedUrls();
    const arr = articles.filter(a => !adopted.has(a.url));
    if (sortMode === 'score') {
      arr.sort((a, b) => (b.score || 0) - (a.score || 0));
    } else {
      arr.sort((a, b) => {
        if (b.date !== a.date) return b.date.localeCompare(a.date);
        return (b.score || 0) - (a.score || 0);
      });
    }
    return arr.slice(0, 50);
  }

  function render() {
    if (!articles.length) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">수집된 기사가 없어요.<br>GitHub Actions를 실행하면 매일 자동으로 채워집니다.</div>';
      return;
    }

    const statusEl = document.getElementById('update-status');
    if (statusEl && !statusEl.textContent) {
      const dates = [...new Set(articles.map(a => a.date))].sort((a,b) => b.localeCompare(a));
      statusEl.textContent = `마지막 업데이트: ${dates[0] || ''}`;
    }

    const top50 = getSortedArticles();

    let html = `
      <div class="sort-bar">
        <span class="sort-option ${sortMode === 'score' ? 'active' : ''}" onclick="setSort('score')">관련도순</span>
        <span class="sort-option ${sortMode === 'date' ? 'active' : ''}" onclick="setSort('date')">최신순</span>
      </div>
      <div class="date-section">
        <div class="date-label">TOP ${top50.length}</div>`;

    for (let i = 0; i < top50.length; i++) {
      const a = top50[i];
      const id = `top-${i}`;
      const globalIdx = articles.indexOf(a);
      const safeUrl = a.url.replace(/'/g, "\\'");
      html += `
        <div class="article-item" id="item-${id}" onclick="toggleSelect('${id}', ${globalIdx})">
          <input type="checkbox" id="cb-${id}">
          <span class="article-num">${i + 1}</span>
          <div class="article-content">
            <a class="article-title" href="${a.url}" target="_blank" onclick="event.stopPropagation()">${a.title}</a>
            <div class="article-meta">
              <span>${formatDate(a.date)}</span>
              <span class="meta-dot"></span>
              <span>${cleanSource(a.source)}</span>
              <span class="meta-dot"></span>
              <span class="keyword-tag">${a.keyword}</span>
            </div>
          </div>
          <button class="copy-link-btn" onclick="event.stopPropagation(); copyLink('${safeUrl}')" title="링크 복사">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>`;
    }
    html += `</div>`;
    document.getElementById('app').innerHTML = html;
  }

  function setSort(mode) {
    sortMode = mode;
    selected.clear();
    updateBar();
    render();
  }

  function toggleSelect(id, idx) {
    const key = String(idx);
    const item = document.getElementById(`item-${id}`);
    const cb = document.getElementById(`cb-${id}`);
    if (selected.has(key)) {
      selected.delete(key);
      item.classList.remove('selected');
      cb.checked = false;
    } else {
      selected.add(key);
      item.classList.add('selected');
      cb.checked = true;
    }
    updateBar();
  }

  function updateBar() {
    const count = selected.size;
    document.getElementById('count').textContent = count;
    document.getElementById('copy-btn').disabled = count === 0;
  }

  function adoptArticles() {
    const items = [...selected].map(idx => articles[parseInt(idx)]).filter(Boolean);
    if (!items.length) return;
    const adopted = getAdoptedUrls();
    items.forEach(a => adopted.add(a.url));
    localStorage.setItem('adopted_urls', JSON.stringify([...adopted]));
    selected.clear();
    updateBar();
    render();
    showToast(`${items.length}개 기사를 채택했어요`);
  }

  function copyLink(url) {
    navigator.clipboard.writeText(url).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
    showToast('링크 복사됐어요');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || '완료';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  const REPO_OWNER = 'jeeyu0603-a11y';
  const REPO_NAME = 'news-clipper';
  const WORKFLOW_FILE = 'daily-crawl.yml';

  function getToken() {
    let token = localStorage.getItem('gh_token');
    if (!token) {
      token = prompt('GitHub Personal Access Token을 입력하세요:');
      if (token) localStorage.setItem('gh_token', token.trim());
    }
    return token;
  }

  async function triggerUpdate() {
    const token = getToken();
    if (!token) return;

    const btn = document.getElementById('update-btn');
    const status = document.getElementById('update-status');
    const prevFirstUrl = articles[0]?.url || null;

    btn.disabled = true;
    btn.textContent = '수집 중...';
    status.textContent = '';

    document.getElementById('app').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        뉴스를 수집하고 있어요...<br>
        <span style="font-size:12px;color:#bbb;margin-top:8px;display:block">약 3~5분 소요됩니다</span>
      </div>`;

    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
        {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        }
      );

      if (res.status === 401) {
        localStorage.removeItem('gh_token');
        alert('토큰이 유효하지 않아요. 다시 입력해주세요.');
        btn.disabled = false;
        btn.textContent = '업데이트';
        loadArticles();
        return;
      }

      await pollWorkflow(token, prevFirstUrl);

    } catch (e) {
      status.textContent = '오류 발생. 다시 시도해주세요.';
      btn.disabled = false;
      btn.textContent = '업데이트';
      loadArticles();
    }
  }

  async function pollWorkflow(token, prevFirstUrl) {
    const btn = document.getElementById('update-btn');
    const status = document.getElementById('update-status');
    let attempts = 0;
    let workflowDone = false;

    const interval = setInterval(async () => {
      attempts++;
      const elapsed = Math.floor(attempts * 10 / 60);
      const sec = (attempts * 10) % 60;

      try {
        if (!workflowDone) {
          const res = await fetch(
            `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1`,
            { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } }
          );
          const data = await res.json();
          const run = data.workflow_runs?.[0];
          if (run && run.status === 'completed') {
            workflowDone = true;
            status.textContent = `수집 완료, 페이지 반영 중...`;
          } else {
            status.textContent = `수집 중... (${elapsed}분 ${sec}초)`;
          }
        }

        if (workflowDone) {
          const dataRes = await fetch('data/articles.json?t=' + Date.now());
          const newArticles = await dataRes.json();
          const newFirstUrl = newArticles[0]?.url || null;
          if (newFirstUrl !== prevFirstUrl && newArticles.length > 0) {
            clearInterval(interval);
            articles = newArticles;
            status.textContent = `마지막 업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;
            btn.disabled = false;
            btn.textContent = '업데이트';
            render();
            return;
          }
          status.textContent = `페이지 반영 중... (${elapsed}분 ${sec}초)`;
        }

        if (attempts > 30) {
          clearInterval(interval);
          status.textContent = '시간 초과. 새로고침 해주세요.';
          btn.disabled = false;
          btn.textContent = '업데이트';
          loadArticles();
        }
      } catch (e) {
        clearInterval(interval);
        loadArticles();
      }
    }, 10000);
  }

  loadArticles();
</script>

</body>
</html>
