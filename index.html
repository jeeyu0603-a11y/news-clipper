<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캐릿 뉴스 클리핑</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    header span {
      font-size: 13px;
      color: #888;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .date-section {
      margin-bottom: 40px;
    }

    .date-label {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
    }

    .article-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border: 2px solid transparent;
    }

    .article-item:hover { background: #f9f9f9; }

    .article-item.selected {
      border-color: #007aff;
      background: #f0f6ff;
    }

    .article-item input[type="checkbox"] {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #007aff;
      flex-shrink: 0;
    }

    .article-content { flex: 1; }

    .article-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: #1d1d1f;
      text-decoration: none;
    }

    .article-title:hover { color: #007aff; }

    .article-meta {
      margin-top: 5px;
      font-size: 12px;
      color: #aaa;
      display: flex;
      gap: 10px;
    }

    .keyword-tag {
      background: #f0f0f5;
      color: #666;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selected-count {
      font-size: 14px;
      color: #555;
    }

    .selected-count strong { color: #007aff; }

    .copy-btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: #0066dd; }
    .copy-btn:disabled { background: #ccc; cursor: not-allowed; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 15px;
      line-height: 2;
    }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d1d1f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }

    .warning {
      font-size: 12px;
      color: #ff6b35;
      margin-top: 4px;
    }

    pb { padding-bottom: 80px; display: block; }
  </style>
</head>
<body>

<header>
  <h1>📋 캐릿 뉴스 클리핑</h1>
  <span id="last-updated"></span>
</header>

<div class="container" id="app">
  <div class="empty-state">뉴스를 불러오는 중...</div>
</div>

<pb></pb>

<div class="bottom-bar">
  <div>
    <div class="selected-count">선택된 기사: <strong id="count">0</strong>개</div>
    <div class="warning" id="warning" style="display:none">3개 이하로 선택해 주세요</div>
  </div>
  <button class="copy-btn" id="copy-btn" disabled onclick="copyPrompt()">
    Claude.ai 프롬프트 복사
  </button>
</div>

<div class="toast" id="toast">클립보드에 복사됐어요!</div>

<script>
  let articles = [];
  let selected = new Set();

  async function loadArticles() {
    try {
      const res = await fetch('data/articles.json?t=' + Date.now());
      articles = await res.json();
      render();
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">기사를 불러올 수 없어요.<br>크롤러가 아직 실행되지 않았거나 데이터가 없어요.</div>';
    }
  }

  function groupByDate(items) {
    const groups = {};
    for (const item of items) {
      if (!groups[item.date]) groups[item.date] = [];
      groups[item.date].push(item);
    }
    return groups;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const fmt = (dt) => `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;

    if (fmt(d) === fmt(today)) return `오늘 · ${fmt(d)}`;
    if (fmt(d) === fmt(yesterday)) return `어제 · ${fmt(d)}`;
    return fmt(d);
  }

  function render() {
    if (!articles.length) {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">수집된 기사가 없어요.<br>GitHub Actions를 실행하면 매일 자동으로 채워집니다.</div>';
      return;
    }

    const dates = [...new Set(articles.map(a => a.date))].sort((a,b) => b.localeCompare(a));
    const grouped = groupByDate(articles);

    document.getElementById('last-updated').textContent = `마지막 업데이트: ${dates[0] || ''}`;

    let html = '';
    for (const date of dates) {
      const items = grouped[date].slice(0, 30);
      html += `<div class="date-section">`;
      html += `<div class="date-label">${formatDate(date)} · ${items.length}개</div>`;
      for (let i = 0; i < items.length; i++) {
        const a = items[i];
        const id = `${date}-${i}`;
        html += `
          <div class="article-item" id="item-${id}" onclick="toggleSelect('${id}', ${articles.indexOf(a)})">
            <input type="checkbox" id="cb-${id}" onclick="event.stopPropagation(); toggleSelect('${id}', ${articles.indexOf(a)})">
            <div class="article-content">
              <a class="article-title" href="${a.url}" target="_blank" onclick="event.stopPropagation()">${a.title}</a>
              <div class="article-meta">
                <span>${a.source}</span>
                <span class="keyword-tag">${a.keyword}</span>
              </div>
            </div>
          </div>`;
      }
      html += `</div>`;
    }

    document.getElementById('app').innerHTML = html;
  }

  function toggleSelect(id, idx) {
    const key = String(idx);
    const item = document.getElementById(`item-${id}`);
    const cb = document.getElementById(`cb-${id}`);

    if (selected.has(key)) {
      selected.delete(key);
      item.classList.remove('selected');
      cb.checked = false;
    } else {
      selected.add(key);
      item.classList.add('selected');
      cb.checked = true;
    }

    updateBar();
  }

  function updateBar() {
    const count = selected.size;
    document.getElementById('count').textContent = count;
    document.getElementById('copy-btn').disabled = count === 0;
    document.getElementById('warning').style.display = count > 3 ? 'block' : 'none';
  }

  function copyPrompt() {
    const items = [...selected].map(idx => articles[parseInt(idx)]).filter(Boolean);
    if (!items.length) return;

    const articleList = items.map((a, i) =>
      `[기사 ${i+1}]\n제목: ${a.title}\nURL: ${a.url}\n${a.description ? '본문 요약: ' + a.description : ''}`
    ).join('\n\n');

    const prompt = `아래 뉴스 기사를 캐릿 스타일로 요약해줘.
캐릿은 Z세대 트렌드 미디어로, 소비·마케팅·트렌드 인사이트를 다루는 매체야.
각 기사를 3~4줄로 핵심만 요약해줘. 숫자와 구체적인 데이터 위주로 써줘.

${articleList}`;

    navigator.clipboard.writeText(prompt).then(() => {
      showToast();
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = prompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    });
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  loadArticles();
</script>

</body>
</html>
