name: 매일 뉴스 수집

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 오전 10시 (KST = UTC+9)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ← 이 줄 추가
    steps:
      - uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 뉴스 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawler/crawl.py

      - name: 결과 커밋
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "bot@news-clipper"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "뉴스 업데이트: $(date '+%Y-%m-%d')"
          git push
